<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Hotel AI">
<title>Hotel AI Assistant</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  :root {
    --bg: #ffffff;
    --bg2: #f5f5f3;
    --bg3: #ebebea;
    --text: #1a1a19;
    --text2: #6b6b68;
    --text3: #a0a09d;
    --border: rgba(0,0,0,0.1);
    --border2: rgba(0,0,0,0.18);
    --blue: #378ADD;
    --blue-dark: #185FA5;
    --green: #1D9E75;
    --green-dark: #0F6E56;
    --radius: 10px;
    --radius-lg: 14px;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #1c1c1e;
      --bg2: #2c2c2e;
      --bg3: #3a3a3c;
      --text: #f2f2f7;
      --text2: #aeaeb2;
      --text3: #636366;
      --border: rgba(255,255,255,0.1);
      --border2: rgba(255,255,255,0.18);
    }
  }
  html, body { height: 100%; background: var(--bg); font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; color: var(--text); }
  
  #app { display: flex; flex-direction: column; height: 100dvh; max-width: 600px; margin: 0 auto; }

  /* Header */
  #header { padding: 14px 16px 10px; background: var(--bg); border-bottom: 0.5px solid var(--border); display: flex; align-items: center; gap: 10px; }
  #header-icon { width: 34px; height: 34px; background: var(--blue); border-radius: 8px; display: flex; align-items: center; justify-content: center; }
  #header-icon svg { width: 18px; height: 18px; fill: #fff; }
  #header-text h1 { font-size: 16px; font-weight: 600; }
  #header-text p { font-size: 12px; color: var(--text2); }

  /* Tabs */
  #tabs { display: flex; background: var(--bg); border-bottom: 0.5px solid var(--border); }
  .tab { flex: 1; padding: 11px 0; font-size: 13px; font-weight: 500; text-align: center; cursor: pointer; color: var(--text2); border-bottom: 2px solid transparent; transition: all 0.15s; }
  .tab.active { color: var(--blue); border-bottom-color: var(--blue); }

  /* Chat */
  #chat-panel { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
  #messages { flex: 1; overflow-y: auto; padding: 14px 14px 6px; display: flex; flex-direction: column; gap: 10px; -webkit-overflow-scrolling: touch; }
  .msg { max-width: 86%; display: flex; flex-direction: column; gap: 3px; }
  .msg.user { align-self: flex-end; align-items: flex-end; }
  .msg.ai { align-self: flex-start; align-items: flex-start; }
  .msg-label { font-size: 10px; color: var(--text3); padding: 0 4px; }
  .msg-bubble { padding: 10px 13px; border-radius: 18px; font-size: 14px; line-height: 1.55; }
  .msg.user .msg-bubble { background: var(--blue); color: #fff; border-bottom-right-radius: 5px; }
  .msg.ai .msg-bubble { background: var(--bg2); color: var(--text); border-bottom-left-radius: 5px; border: 0.5px solid var(--border); }
  #chat-input-area { padding: 10px 12px; border-top: 0.5px solid var(--border); display: flex; gap: 8px; background: var(--bg); padding-bottom: max(10px, env(safe-area-inset-bottom)); }
  #chat-input { flex: 1; padding: 10px 14px; border: 0.5px solid var(--border2); border-radius: 22px; font-size: 15px; background: var(--bg2); color: var(--text); outline: none; }
  #chat-input:focus { border-color: var(--blue); }
  #send-btn { width: 40px; height: 40px; background: var(--blue); color: #fff; border: none; border-radius: 50%; font-size: 17px; cursor: pointer; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
  #send-btn:disabled { opacity: 0.4; }

  /* Thinking */
  .thinking { display: flex; gap: 4px; padding: 12px 14px; align-items: center; }
  .thinking span { width: 7px; height: 7px; border-radius: 50%; background: var(--text3); animation: bounce 1.2s infinite; }
  .thinking span:nth-child(2) { animation-delay: 0.2s; }
  .thinking span:nth-child(3) { animation-delay: 0.4s; }
  @keyframes bounce { 0%,80%,100%{transform:translateY(0)} 40%{transform:translateY(-5px)} }

  /* Knowledge panel */
  #knowledge-panel { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
  #kb-toolbar { padding: 10px 14px; border-bottom: 0.5px solid var(--border); display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  #kb-toolbar select { font-size: 14px; padding: 7px 10px; border-radius: var(--radius); border: 0.5px solid var(--border2); background: var(--bg2); color: var(--text); flex: 1; }
  #add-cat-btn-top { padding: 7px 12px; border-radius: var(--radius); border: 0.5px solid var(--border2); background: none; color: var(--text2); font-size: 13px; cursor: pointer; white-space: nowrap; }
  #kb-content-area { flex: 1; overflow-y: auto; padding: 12px 14px; -webkit-overflow-scrolling: touch; }
  .entry-card { background: var(--bg2); border: 0.5px solid var(--border); border-radius: var(--radius); padding: 11px 13px; margin-bottom: 8px; }
  .entry-header { display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; margin-bottom: 4px; }
  .entry-title { font-size: 13px; font-weight: 600; color: var(--text); }
  .entry-body { font-size: 13px; color: var(--text2); line-height: 1.5; }
  .entry-del { font-size: 12px; color: var(--text3); cursor: pointer; padding: 2px 8px; border-radius: 6px; background: var(--bg3); flex-shrink: 0; }
  .entry-del:active { background: #FAECE7; color: #D85A30; }
  #add-entry-form { padding: 10px 14px; border-top: 0.5px solid var(--border); background: var(--bg); padding-bottom: max(10px, env(safe-area-inset-bottom)); }
  #add-entry-form input, #add-entry-form textarea { width: 100%; margin-bottom: 8px; padding: 9px 12px; border: 0.5px solid var(--border2); border-radius: var(--radius); font-size: 14px; background: var(--bg2); color: var(--text); font-family: inherit; }
  #add-entry-form textarea { height: 68px; resize: none; }
  #add-entry-form input:focus, #add-entry-form textarea:focus { outline: none; border-color: var(--blue); }
  #save-entry-btn { width: 100%; padding: 11px; background: var(--green); color: #fff; border: none; border-radius: var(--radius); font-size: 15px; font-weight: 500; cursor: pointer; }
  #save-entry-btn:active { background: var(--green-dark); }
  .empty-state { text-align: center; padding: 40px 20px; color: var(--text3); font-size: 14px; }

  /* Settings panel */
  #settings-panel { flex: 1; overflow-y: auto; padding: 16px 14px; padding-bottom: max(16px, env(safe-area-inset-bottom)); }
  .settings-section { margin-bottom: 24px; }
  .settings-label { font-size: 12px; color: var(--text2); text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 8px; padding: 0 4px; }
  .settings-card { background: var(--bg2); border: 0.5px solid var(--border); border-radius: var(--radius-lg); overflow: hidden; }
  .settings-row { padding: 13px 14px; border-bottom: 0.5px solid var(--border); display: flex; flex-direction: column; gap: 6px; }
  .settings-row:last-child { border-bottom: none; }
  .settings-row label { font-size: 14px; font-weight: 500; }
  .settings-row input { width: 100%; padding: 9px 12px; border: 0.5px solid var(--border2); border-radius: var(--radius); font-size: 14px; background: var(--bg); color: var(--text); font-family: inherit; }
  .settings-row input:focus { outline: none; border-color: var(--blue); }
  .settings-row p { font-size: 12px; color: var(--text2); line-height: 1.4; }
  #save-settings-btn { width: 100%; padding: 13px; background: var(--blue); color: #fff; border: none; border-radius: var(--radius); font-size: 15px; font-weight: 500; cursor: pointer; margin-top: 8px; }
  #clear-data-btn { width: 100%; padding: 13px; background: none; border: 0.5px solid #D85A30; color: #D85A30; border-radius: var(--radius); font-size: 15px; cursor: pointer; margin-top: 8px; }

  .hidden { display: none !important; }
  .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 6px; }
  .dot.teal { background: #1D9E75; }
  .dot.blue { background: #378ADD; }
  .dot.amber { background: #BA7517; }
  .dot.coral { background: #D85A30; }
  .dot.purple { background: #7F77DD; }
</style>
</head>
<body>
<div id="app">
  <div id="header">
    <div id="header-icon">
      <svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-1 14H9V8h2v8zm4 0h-2V8h2v8z"/></svg>
    </div>
    <div id="header-text">
      <h1 id="hotel-name-display">Hotel AI Assistant</h1>
      <p>Your personal front desk helper</p>
    </div>
  </div>

  <div id="tabs">
    <div class="tab active" data-tab="chat">💬 Ask AI</div>
    <div class="tab" data-tab="knowledge">📋 Info</div>
    <div class="tab" data-tab="settings">⚙️ Settings</div>
  </div>

  <!-- CHAT -->
  <div id="chat-panel">
    <div id="messages"></div>
    <div id="chat-input-area">
      <input id="chat-input" placeholder="Ask anything…" autocomplete="off" />
      <button id="send-btn">↑</button>
    </div>
  </div>

  <!-- KNOWLEDGE -->
  <div id="knowledge-panel" class="hidden">
    <div id="kb-toolbar">
      <select id="cat-select"></select>
      <button id="add-cat-btn-top">+ Category</button>
    </div>
    <div id="kb-content-area"></div>
    <div id="add-entry-form">
      <input id="entry-title-input" placeholder="Title (e.g. Room 205 – Deluxe Suite)" />
      <textarea id="entry-body-input" placeholder="Details (e.g. King bed, sea view, €180/night, includes breakfast)"></textarea>
      <button id="save-entry-btn">Save Entry</button>
    </div>
  </div>

  <!-- SETTINGS -->
  <div id="settings-panel" class="hidden">
    <div class="settings-section">
      <div class="settings-label">Hotel Details</div>
      <div class="settings-card">
        <div class="settings-row">
          <label>Hotel / Restaurant Name</label>
          <input id="setting-name" placeholder="e.g. Hotel Bellevue" />
        </div>
        <div class="settings-row">
          <label>Custom instructions (optional)</label>
          <input id="setting-instructions" placeholder="e.g. Always greet guests warmly, reply in Dutch" />
          <p>Extra guidance for how the AI should respond.</p>
        </div>
      </div>
      <button id="save-settings-btn">Save Settings</button>
    </div>
    <div class="settings-section">
      <div class="settings-label">Data</div>
      <div class="settings-card">
        <div class="settings-row">
          <label>All data is saved on this device</label>
          <p>Your knowledge base and settings are stored in your browser's local storage. They will persist as long as you don't clear your browser data.</p>
        </div>
      </div>
      <button id="clear-data-btn">Clear all data</button>
    </div>
  </div>
</div>

<script>
const COLORS = ['teal','blue','amber','coral','purple'];
const DEFAULT_CATS = [
  { id: 'rooms', name: 'Rooms', color: 'teal', entries: [
    { id: 'r1', title: 'Room 101 – Standard', body: 'Single bed, garden view, max 1 adult, €90/night. No pets. Quiet side of building.' },
    { id: 'r2', title: 'Room 205 – Deluxe Suite', body: 'King bed, sea view, max 2 adults + 1 child, €180/night. Includes breakfast. Jacuzzi in bathroom.' },
    { id: 'r3', title: 'Room 310 – Family Room', body: 'Two queen beds, courtyard view, max 2 adults + 2 children, €220/night. Crib available on request.' }
  ]},
  { id: 'restaurant', name: 'Restaurant', color: 'amber', entries: [
    { id: 'm1', title: 'Opening hours', body: 'Breakfast 7:00–10:30. Lunch 12:00–14:30. Dinner 18:30–22:00. Bar open until midnight.' },
    { id: 'm2', title: "Today's special", body: 'Grilled sea bass with lemon butter, served with seasonal vegetables. €24. Vegetarian: mushroom risotto €18.' },
    { id: 'm3', title: 'Allergen policy', body: 'Gluten-free and dairy-free available on request. Nut-free kitchen. Vegan options always available.' }
  ]},
  { id: 'policies', name: 'Policies', color: 'blue', entries: [
    { id: 'p1', title: 'Check-in / Check-out', body: 'Check-in from 15:00. Check-out by 11:00. Early check-in €20 if available. Late check-out €30 until 14:00.' },
    { id: 'p2', title: 'Cancellation', body: 'Free cancellation up to 48h before arrival. Within 48h: 1 night charged. No-show: full stay charged.' }
  ]},
  { id: 'faq', name: 'FAQ', color: 'purple', entries: [
    { id: 'f1', title: 'WiFi', body: 'Network: HotelGuest_5G. Password: Welcome2024. Works in all rooms and public areas.' },
    { id: 'f2', title: 'Parking', body: 'Free parking on-site. Entrance on side street. Barrier code: 4821. EV chargers in spaces 12–15.' }
  ]}
];

function loadState() {
  try {
    const saved = localStorage.getItem('hotel_ai_state');
    if (saved) return JSON.parse(saved);
  } catch(e) {}
  return {
    categories: JSON.parse(JSON.stringify(DEFAULT_CATS)),
    activeCat: 'rooms',
    hotelName: '',
    instructions: '',
    messages: []
  };
}

function saveState() {
  try { localStorage.setItem('hotel_ai_state', JSON.stringify(state)); } catch(e) {}
}

let state = loadState();

function buildKBContext() {
  const name = state.hotelName || 'our hotel and restaurant';
  let ctx = `You are a helpful AI assistant for ${name}. Answer questions using ONLY the knowledge base below. Be concise and practical — one or two sentences is usually enough. If the answer isn't in the knowledge base, say so politely and suggest asking a colleague.`;
  if (state.instructions) ctx += `\n\nExtra instructions: ${state.instructions}`;
  ctx += '\n\n=== KNOWLEDGE BASE ===';
  state.categories.forEach(cat => {
    ctx += `\n\n## ${cat.name}`;
    cat.entries.forEach(e => { ctx += `\n### ${e.title}\n${e.body}`; });
  });
  return ctx;
}

function renderMessages() {
  const c = document.getElementById('messages');
  c.innerHTML = state.messages.map(m => `
    <div class="msg ${m.role}">
      <div class="msg-label">${m.role === 'user' ? 'You' : 'AI'}</div>
      <div class="msg-bubble">${m.content.replace(/\n/g,'<br>')}</div>
    </div>`).join('');
  c.scrollTop = c.scrollHeight;
}

function addThinking() {
  const c = document.getElementById('messages');
  const el = document.createElement('div');
  el.className = 'msg ai'; el.id = 'thinking-bubble';
  el.innerHTML = '<div class="msg-label">AI</div><div class="msg-bubble thinking"><span></span><span></span><span></span></div>';
  c.appendChild(el);
  c.scrollTop = c.scrollHeight;
}

function removeThinking() {
  const el = document.getElementById('thinking-bubble');
  if (el) el.remove();
}

async function sendMessage() {
  const input = document.getElementById('chat-input');
  const text = input.value.trim();
  if (!text) return;
  input.value = '';
  document.getElementById('send-btn').disabled = true;
  state.messages.push({ role: 'user', content: text });
  renderMessages();
  addThinking();
  saveState();

  try {
    const apiMessages = state.messages.map(m => ({ role: m.role === 'user' ? 'user' : 'assistant', content: m.content }));
    const res = await fetch('https://api.anthropic.com/v1/messages', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        model: 'claude-sonnet-4-20250514',
        max_tokens: 1000,
        system: buildKBContext(),
        messages: apiMessages
      })
    });
    const data = await res.json();
    const reply = data.content?.map(b => b.text || '').join('') || 'Sorry, no response received.';
    removeThinking();
    state.messages.push({ role: 'ai', content: reply });
  } catch(e) {
    removeThinking();
    state.messages.push({ role: 'ai', content: 'Connection error. Please check your internet and try again.' });
  }
  renderMessages();
  saveState();
  document.getElementById('send-btn').disabled = false;
}

function renderKnowledge() {
  const cat = state.categories.find(c => c.id === state.activeCat) || state.categories[0];
  if (!cat) return;
  const sel = document.getElementById('cat-select');
  sel.innerHTML = state.categories.map(c =>
    `<option value="${c.id}" ${c.id === cat.id ? 'selected':''}><span class="dot ${c.color}"></span>${c.name} (${c.entries.length})</option>`
  ).join('');
  const area = document.getElementById('kb-content-area');
  if (cat.entries.length === 0) {
    area.innerHTML = '<div class="empty-state">No entries yet.<br>Add one below.</div>';
    return;
  }
  area.innerHTML = cat.entries.map(e => `
    <div class="entry-card">
      <div class="entry-header">
        <div class="entry-title">${e.title}</div>
        <span class="entry-del" data-id="${e.id}" data-cat="${cat.id}">delete</span>
      </div>
      <div class="entry-body">${e.body}</div>
    </div>`).join('');
  area.querySelectorAll('.entry-del').forEach(btn => {
    btn.addEventListener('click', () => {
      const c = state.categories.find(x => x.id === btn.dataset.cat);
      if (c) c.entries = c.entries.filter(e => e.id !== btn.dataset.id);
      saveState(); renderKnowledge();
    });
  });
}

function renderSettings() {
  document.getElementById('setting-name').value = state.hotelName || '';
  document.getElementById('setting-instructions').value = state.instructions || '';
  document.getElementById('hotel-name-display').textContent = state.hotelName || 'Hotel AI Assistant';
}

function switchTab(tab) {
  document.querySelectorAll('.tab').forEach(t => t.classList.toggle('active', t.dataset.tab === tab));
  document.getElementById('chat-panel').classList.toggle('hidden', tab !== 'chat');
  document.getElementById('knowledge-panel').classList.toggle('hidden', tab !== 'knowledge');
  document.getElementById('settings-panel').classList.toggle('hidden', tab !== 'settings');
  if (tab === 'knowledge') renderKnowledge();
  if (tab === 'settings') renderSettings();
}

// Welcome message if first time
if (state.messages.length === 0) {
  state.messages.push({ role: 'ai', content: "Hi! I'm your hotel & restaurant assistant 👋\n\nTry asking me:\n• What's the WiFi password?\n• What's tonight's special?\n• What's the cancellation policy?\n• Tell me about Room 205\n\nGo to the Info tab to add your own information." });
  saveState();
}

// Events
document.querySelectorAll('.tab').forEach(t => t.addEventListener('click', () => switchTab(t.dataset.tab)));
document.getElementById('send-btn').addEventListener('click', sendMessage);
document.getElementById('chat-input').addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); sendMessage(); } });

document.getElementById('cat-select').addEventListener('change', e => {
  state.activeCat = e.target.value;
  saveState(); renderKnowledge();
});

document.getElementById('add-cat-btn-top').addEventListener('click', () => {
  const name = prompt('New category name (e.g. Spa, Events, Staff):');
  if (!name) return;
  const id = 'cat_' + Date.now();
  const color = COLORS[state.categories.length % COLORS.length];
  state.categories.push({ id, name, color, entries: [] });
  state.activeCat = id;
  saveState(); renderKnowledge();
});

document.getElementById('save-entry-btn').addEventListener('click', () => {
  const title = document.getElementById('entry-title-input').value.trim();
  const body = document.getElementById('entry-body-input').value.trim();
  if (!title || !body) { alert('Please fill in both the title and details.'); return; }
  const cat = state.categories.find(c => c.id === state.activeCat);
  if (cat) cat.entries.push({ id: 'e' + Date.now(), title, body });
  document.getElementById('entry-title-input').value = '';
  document.getElementById('entry-body-input').value = '';
  saveState(); renderKnowledge();
});

document.getElementById('save-settings-btn').addEventListener('click', () => {
  state.hotelName = document.getElementById('setting-name').value.trim();
  state.instructions = document.getElementById('setting-instructions').value.trim();
  saveState(); renderSettings();
  alert('Settings saved!');
});

document.getElementById('clear-data-btn').addEventListener('click', () => {
  if (confirm('This will delete all your knowledge base entries and settings. Are you sure?')) {
    localStorage.removeItem('hotel_ai_state');
    location.reload();
  }
});

renderMessages();
</script>
</body>
</html>
